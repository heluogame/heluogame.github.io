# 看板娘通用设置：开关、位置和角色都在这个文件修改，对所有星期生效
enable: true # 总开关；false 时不加载播放器和素材
default_visible: false # true=打开页面时显示；false=只显示爱心入口，主动点击后才加载和显示
premultiplied_alpha: false # 默认透明混合方式；有特殊要求的模型单独覆盖
speed: 0.5 # 默认播放速度；模型只需填写不同的速度
# 菜单名称从完整名称提取；同一天、同分类重名时自动加序号
# 默认使用 default 皮肤和“互动”动作标签；PNG 直链在各模型 texture_urls 中
# 显示规范固定在公共脚本：100% 待机高度 270px，缩放 60%-300%，优先显示立绘
right: 72 # 初始距离窗口右侧的距离，避开博客原有工具按钮
bottom: 18 # 初始距离窗口底部的距离
fps: 60 # 帧率上限
hide_mobile: true # 手机和窄屏默认不显示，也不请求播放库及素材
mobile_breakpoint: 768 # 小于等于此宽度按手机端处理，单位 px

use: 7 # 全局临时预览：0=关闭预览并正常轮换；1-7=固定显示对应星期，优先于 weekly.enable
weekly:
  enable: true # 按星期自动轮换，只加载当天对应的角色
  timezone: Asia/Shanghai # 统一使用北京时间，与访客电脑的时区无关

